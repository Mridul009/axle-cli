[project]
name = "axle-cli-agent"
version = "0.1.0"
description = "Terminal-first coding agent for Axle with Goose integration."
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.5",
]

[project.scripts]
axle = "axle_cli.main:main"
axle-demo-coordinator = "axle_cli.demo:coordinator_main"
axle-demo-worker = "axle_cli.demo:worker_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"axle_cli.dashboard" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.setuptools.packages.find]
include = ["axle_cli*"]
